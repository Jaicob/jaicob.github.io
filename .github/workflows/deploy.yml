name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Fetch private fonts
        uses: actions/checkout@v7
        with:
          repository: Jaicob/fonts
          ref: main
          path: .private-fonts
          ssh-key: ${{ secrets.FONTS_DEPLOY_KEY }}
          persist-credentials: false
      - name: Copy fonts into site
        run: |
          mkdir -p public/fonts
          for file in PPMondwest-Regular.otf PPMori-Regular.otf PPMori-Semibold.otf; do
            test -s ".private-fonts/$file"
            cp ".private-fonts/$file" "public/fonts/$file"
          done
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
